name: Sync with upstream
on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/CapSoftware/Cap.git

      - name: Sync main branch
        run: |
          git fetch upstream main
          git checkout main
          git merge upstream/main --no-edit
          git push origin main

      - name: Sync tags (force to handle conflicts)
        run: |
          # Force fetch tags to overwrite any conflicts
          git fetch upstream --tags --force

          # Get list of upstream cap-v* tags
          UPSTREAM_TAGS=$(git tag -l "cap-v*" --sort=-version:refname)
          echo "Found upstream tags:"
          echo "$UPSTREAM_TAGS" | head -10

          # Push all tags to origin (force to handle conflicts)
          git push origin --tags --force
          echo "Tags synced successfully!"

      - name: Check for new releases to build
        run: |
          # Get latest upstream tag
          LATEST_TAG=$(git tag -l "cap-v*" --sort=-version:refname | head -n1)
          echo "Latest tag: $LATEST_TAG"

          if [ -z "$LATEST_TAG" ]; then
            echo "No cap-v* tags found"
            exit 0
          fi

          # Check if release already exists
          if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            echo "Release already exists for $LATEST_TAG"
          else
            echo "No release for $LATEST_TAG - build will be triggered by tag push"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
