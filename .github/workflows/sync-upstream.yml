name: Sync with upstream
on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/CapSoftware/Cap.git

      - name: Sync main branch
        run: |
          git fetch upstream main
          git checkout main
          git merge upstream/main --no-edit

      # Upstream main is frequently red on `biome ci` (formatting), and mirroring
      # it verbatim breaks the fork's Format (Biome) job every sync. Auto-format
      # with the same pinned Biome version CI uses, and commit any fixes so the
      # fork's main stays green without manual intervention.
      - name: Auto-format after merge
        run: |
          npx --yes @biomejs/biome@2.2.0 format --write . || true
          if ! git diff --quiet; then
            git commit -am "style: biome-format after upstream sync"
          fi

      - name: Push main
        run: git push origin main

      - name: Sync tags (force to handle conflicts)
        run: |
          # Force fetch tags to overwrite any conflicts
          git fetch upstream --tags --force

          # Get list of upstream cap-v* tags
          UPSTREAM_TAGS=$(git tag -l "cap-v*" --sort=-version:refname)
          echo "Found upstream tags:"
          echo "$UPSTREAM_TAGS" | head -10

          # Push all tags to origin (force to handle conflicts)
          git push origin --tags --force
          echo "Tags synced successfully!"

      - name: Check if release exists
        id: check-release
        run: |
          LATEST_TAG=$(git tag -l "cap-v*" --sort=-version:refname | head -n1)
          echo "Latest tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

          if [ -z "$LATEST_TAG" ]; then
            echo "No cap-v* tags found"
            echo "exists=skip" >> $GITHUB_OUTPUT
          elif gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            echo "Release already exists for $LATEST_TAG - skipping build"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "No release for $LATEST_TAG - will trigger build"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger build for new releases
        if: steps.check-release.outputs.exists == 'false'
        run: |
          echo "Triggering build for ${{ steps.check-release.outputs.tag }}"
          gh workflow run auto-build-release.yml --repo ${{ github.repository }} --ref main -f tag="${{ steps.check-release.outputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
